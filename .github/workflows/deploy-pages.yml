name: Deploy MEGA frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://upajzbaeuwzbhxfebzvi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Preserve generated website projects; Vite only copies files from public/ into dist.
      - name: Include managed website projects
        run: |
          if [ -d webs/projects ]; then
            mkdir -p dist/webs/projects
            cp -R webs/projects/. dist/webs/projects/
            echo "Included website project files in the Pages artifact."
          else
            echo "No webs/projects directory yet; deploying the dashboard only."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
