<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta name="description" content="MEGA secure administration dashboard." />
    <meta name="color-scheme" content="dark" />
    <title>MEGA Admin — Control Center</title>
    <style>
      html,body{margin:0;min-height:100%;background:#080b14;color:#f4f5fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      #boot-card{width:min(100%,560px);box-sizing:border-box;padding:28px;border:1px solid #30374b;border-radius:22px;background:#101625}
      #boot-card h1{margin:8px 0 12px;font-size:28px}
      #boot-card p{color:#b7bfd3;line-height:1.6}
      #boot-status{font-size:13px;color:#c4b5fd}
    </style>
    <script>
      function showStartupError(message) {
        var status = document.getElementById('boot-status');
        if (status && status.isConnected) {
          status.textContent = 'Startup error: ' + message;
          status.style.color = '#fca5a5';
        }
      }
      window.addEventListener('error', function (event) {
        showStartupError(event.message || 'A required application file failed to load. Check the JavaScript and CSS asset requests.');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        showStartupError(reason && reason.message ? reason.message : 'An unhandled startup promise failed.');
      });
      window.setTimeout(function () {
        var screen = document.getElementById('boot-screen');
        var status = document.getElementById('boot-status');
        if (screen && screen.isConnected && status && status.textContent === 'Checking application files…') {
          status.textContent = 'Startup timed out: the application did not mount. Reload once; if this persists, check the browser network log for the assets/index-*.js request.';
          status.style.color = '#fca5a5';
        }
      }, 12000);
    </script>
  </head>
  <body>
    <div id="root">
      <main id="boot-screen">
        <section id="boot-card">
          <p style="font-weight:800;letter-spacing:3px;color:#c4b5fd">MEGA</p>
          <h1>Loading your workspace…</h1>
          <p>The application is starting. If this message remains visible, the JavaScript bundle may not have loaded.</p>
          <p id="boot-status">Checking application files…</p>
        </section>
      </main>
    </div>
    <script type="module" src="../src/main.tsx"></script>
  </body>
</html>
